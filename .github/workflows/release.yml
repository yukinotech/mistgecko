name: Offline Android Release

on:
  push:
    branches: [main]
    paths: [version.properties]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version and source
        id: version
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/release_metadata.py >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: app/src/ai/assets/models/lama_fp32.onnx
          key: lama-${{ hashFiles('model.lock.json') }}
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required=['KEYSTORE_B64','STORE_PASSWORD','KEY_PASSWORD','KEY_ALIAS']
          if any(not os.environ.get(key) for key in required):
              raise SystemExit('Missing Android signing secrets. See docs/RELEASING.md')
          key=Path(os.environ['RUNNER_TEMP'])/'mistgecko-release.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_B64'], validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write(f'MISTGECKO_KEYSTORE={key}\n')
          PY
      - name: Build and verify complete offline APK
        env:
          MISTGECKO_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MISTGECKO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MISTGECKO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/build_release.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MistGecko-${{ steps.version.outputs.version }}-offline-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "MistGecko $VERSION" --draft --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mistgecko-release.jks"
